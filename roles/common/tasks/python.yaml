- name: install python
  ansible.builtin.dnf:
    name: "{{item}}"
    state: installed
  loop:
  - python3.14
  # - gcc
  - python3.14-pip


- name: install dependencies
  ansible.builtin.pip:
    requirements: requirements.txt
    # executable: pip3.9
    virtualenv: /app/.venv
    virtualenv_command: python3.14 -m venv
  args:
    chdir: /app

