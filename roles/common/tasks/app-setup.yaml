- name: create roboshop system user
  ansible.builtin.user:
    name: roboshop
    create_home: false
    shell: /sbin/nologin
    system: true
    comment: "roboshop system user"
    home: /app

- name: removing existing app directory
  ansible.builtin.file:
    path: /app
    state: absent

- name: removing existing zip files
  ansible.builtin.file:
    path: /tmp/{{ component }}.zip
    state: absent

- name: create app directory
  ansible.builtin.file:
    path: /app
    state: directory

- name: Download the application code
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/{{ component }}-v4.zip
    # url: https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip
    dest: /tmp/{{ component }}.zip

# This module thinks file exists on ansible control server, needs to extract on to remote machine({{ component }})
# remote_src: yes => means file already exits in {{ component }} server
- name: extract the code 
  ansible.builtin.unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes