- name: Load schema, app-user, and master-data SQL scripts if DB not exists
  ansible.builtin.shell: |
    mysql -h {{ mysql_host }} -uroot -p{{ mysql_root_password }} < {{ item }}
  loop:
    # - /app/db/schema.sql
    - /app/db/app-user.sql
    - /app/db/master-data.sql
  when: cities_countries_count.rc != 0 or cities_countries_count.stdout | int == 0
  tags:
  - mysql

