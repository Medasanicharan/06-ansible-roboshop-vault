- name: install MySQL client ## mentioned in loop
  ansible.builtin.dnf:
    name: mysql-server
    state: present

- name: Check if cities data exists or not
  ansible.builtin.shell: |
    mysql -h {{ mysql_host }} -uroot -p{{ mysql_root_password }} -e "USE cities; SHOW TABLES LIKE 'countries';" 
    mysql -h {{ mysql_host }} -uroot -p{{ mysql_root_password }} -N -B -e "SELECT COUNT(*) FROM cities.cities;"
  register: cities_countries_count
  ignore_errors: yes
  changed_when: false
  tags:
  - mysql

- name: print cities & countries
  ansible.builtin.debug:
    msg: "Database check result: {{ cities_countries_count.rc }} (0 means DB exists, non-zero means not exists)"
  tags:
  - mysql

