- name: application Setup
  include_role:
    name: common
    tasks_from: app-setup

- name: "{{ component }} Setup"
  include_role:
    name: common
    tasks_from: nodejs

- name: systemd setup
  include_role:
    name: common
    tasks_from: systemd

- name: copying MongoDB repo
  ansible.builtin.copy:
    src: mongodb.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: install MongoDB client
  ansible.builtin.dnf:
    name: mongodb-mongosh
    state: present

- name: check products loaded or not
  ansible.builtin.command: >
    mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
  register: catalogue_db_check
# mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
# mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'

- name: Show/print products count
  ansible.builtin.debug:
    msg: "Number of products loaded: {{ catalogue_db_check }}"

- name: Load products data
  ansible.builtin.shell: >
    mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
  when: catalogue_db_check.stdout | int < 0

- name: start and enable service
  include_role:
    name: common
    tasks_from: restart