- name: Enable mysql 8.4
  ansible.builtin.command: dnf module enable mysql:8.4 -y

- name: Install MySQL server
  ansible.builtin.dnf:
    name: mysql-server
    state: installed

- name: Start and enable MySQL service
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: yes

- name: Install PyMySQL for Python3 
  ansible.builtin.pip:
    name: PyMySQL
    executable: pip3.9

- name: Check if MySQL root password works
  ansible.builtin.shell: |
    mysql -h {{ mysql_host }} -u {{ mysql_root_user }} -p{{ mysql_root_password }} -e "SELECT 1;" >/dev/null 2>&1
  register: root_pass_check
  ignore_errors: yes
  changed_when: false

- name: Debug root password check
  ansible.builtin.debug:
    msg: "MySQL root password check RC = {{ root_pass_check.rc }}"

- name: Setup MySQL root password if not set
  ansible.builtin.shell: |
    mysql_secure_installation --set-root-pass {{ mysql_root_password }}
  when: root_pass_check.rc != 0
  changed_when: true

