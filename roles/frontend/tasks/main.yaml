- name: disable frontend default module
  ansible.builtin.command: dnf module disable nginx -y

- name: enable frontend:7
  ansible.builtin.command: dnf module enable nginx:1.24 -y

- name: install frontend 
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Start & Enable frontend Service
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes

- name: find all contents inside the directory
  ansible.builtin.find:
    paths: /usr/share/nginx/html
    recurse: true
    hidden: true
    file_type: any
  register: directory_contents

- name: Print all contents inside the directory
  ansible.builtin.debug:
    msg: "{{ directory_contents }}"

- name: delete the discovered contents
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ directory_contents.files }}"

# - name: remove html directory
#   ansible.builtin.file:
#     path: /usr/share/nginx/html
#     state: absent

- name: create html directory
  ansible.builtin.file:
    path: /usr/share/nginx/html
    state: directory

- name: Download the application code
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/frontend-{{ app_version }}.zip
    # url: https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip
    dest: /tmp/frontend.zip

- name: unzip frontend code
  ansible.builtin.unarchive:
    src: /tmp/frontend.zip
    dest: /usr/share/nginx/html 
    remote_src: yes

- name: remove default nginx conf
  ansible.builtin.file:
    path: /etc/nginx/default.d/roboshop.conf
    state: absent

- name: copy roboshop ngnx conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/default.d/roboshop.conf
  notify:
    - Restart nginx